name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build package
        run: ./PackageRelease.command

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="dist/$(cat dist/archive-name.txt)"
          gh release create "$GITHUB_REF_NAME" \
            "$asset" \
            --title "MacroMac $GITHUB_REF_NAME" \
            --notes "Open-source JSON macro runner for macOS desktop automation. This build is unsigned and not notarized; macOS may require manual approval on first launch."
